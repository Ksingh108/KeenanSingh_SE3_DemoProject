openapi: 3.0.3
info:
  title: Gringotts Bank Branch Booking API
  description: API for booking branch visits at Gringotts Bank
  version: 1.0.0
  contact:
    name: Gringotts Bank IT
    email: it@gringotts.com

servers:
  - url: http://localhost:8080/api
    description: Development server
  - url: https://api.gringotts.com/api
    description: Production server

paths:
  /bookings:
    post:
      summary: Create a new booking
      tags: [Bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '200':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Time slot already booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Get all bookings
      tags: [Bookings]
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'

  /bookings/{email}:
    get:
      summary: Get bookings by email
      tags: [Bookings]
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: List of bookings for the email
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'

  /availability/{branchId}/{date}:
    get:
      summary: Check availability for a branch on a specific date
      tags: [Availability]
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Availability information
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean

  /branches:
    get:
      summary: Get all branches
      tags: [Branches]
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'

  /health:
    get:
      summary: Health check endpoint
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Service is unhealthy

  /ready:
    get:
      summary: Readiness check endpoint
      tags: [Health]
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready

components:
  schemas:
    CreateBookingRequest:
      type: object
      required:
        - branch_id
        - service_id
        - customer_name
        - email
        - phone
        - date
        - time_slot
      properties:
        branch_id:
          type: string
        service_id:
          type: string
        customer_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        date:
          type: string
          format: date
        time_slot:
          type: string
          pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'

    Booking:
      type: object
      properties:
        id:
          type: string
        branch_id:
          type: string
        service_id:
          type: string
        customer_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        date:
          type: string
          format: date
        time_slot:
          type: string
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        created_at:
          type: string
          format: date-time
        branch:
          $ref: '#/components/schemas/Branch'
        service:
          $ref: '#/components/schemas/Service'

    Branch:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string
        phone:
          type: string
        hours:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        created_at:
          type: string
          format: date-time

    Service:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []