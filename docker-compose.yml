##############################
# Development Docker Compose
# Services:
#  - app: Go server built from the repository, exposes port 8080
#  - postgres: Postgres DB used by the app; init SQL is mounted for schema seeding
##############################

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=gringotts
      - DB_PASSWORD=gringotts123
      - DB_NAME=bookings
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gringotts-network
    restart: unless-stopped
    healthcheck:
      # Healthcheck: verifies the app's HTTP /health endpoint to determine readiness
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=gringotts
      - POSTGRES_PASSWORD=gringotts123
      - POSTGRES_DB=bookings
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - gringotts-network
    restart: unless-stopped
    healthcheck:
      # Healthcheck: pg_isready checks DB availability
      test: ["CMD-SHELL", "pg_isready -U gringotts -d bookings"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:

networks:
  gringotts-network:
    driver: bridge