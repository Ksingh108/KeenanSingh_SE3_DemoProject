##############################
# Development Docker Compose
# Services:
#  - app: Go server built from the repository, exposes port 8080
#  - postgres: Postgres DB used by the app; Goose migrations create and seed the schema
##############################

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=demo
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=gringotts
      - DB_PASSWORD=gringotts123
      - DB_NAME=bookings
      - DB_SSL_MODE=verify-full
      - DB_SSL_ROOT_CERT=/run/postgres-tls/ca.crt
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gringotts-network
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - postgres-tls:/run/postgres-tls:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      # Healthcheck: process liveness; database readiness is checked separately at /ready
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    build:
      context: ./docker/postgres
    environment:
      - POSTGRES_USER=gringotts
      - POSTGRES_PASSWORD=gringotts123
      - POSTGRES_DB=bookings
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-tls:/var/lib/postgresql/tls
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
    networks:
      - gringotts-network
    restart: unless-stopped
    healthcheck:
      # Healthcheck: pg_isready checks DB availability
      test: ["CMD-SHELL", "pg_isready -U gringotts -d bookings"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  postgres-tls:

networks:
  gringotts-network:
    driver: bridge